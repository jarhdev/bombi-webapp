<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bombi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=League+Spartan:wght@500;600;700&display=swap">
<style>
  :root {
    --cream: #F4E9D6;
    --cream-2: #EEE0C8;
    --ink: #3B2521;
    --ink-soft: rgba(59,37,33,0.62);
    --ink-faint: rgba(59,37,33,0.32);
    --carmesi: #6F1425;
    --rosa: #E29AA5;
    --tostado: #C89F74;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'League Spartan', sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 420px;
    padding: 28px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .logo {
    width: clamp(150px, 42vw, 210px);
    height: auto;
    object-fit: contain;
  }

  .tagline {
    margin: 22px 0 4px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 6vw, 25px);
    letter-spacing: 0.2px;
    color: var(--carmesi);
    text-align: center;
  }

  .est {
    margin: 0 0 36px;
    font-size: clamp(13px, 3.6vw, 15px);
    font-weight: 500;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: clamp(17px, 4.6vw, 21px) 20px;
    border-radius: 999px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(17px, 4.6vw, 20px);
    text-decoration: none;
    text-align: center;
    border: none;
    transition: transform 120ms ease, filter 120ms ease;
  }

  .btn:active { transform: scale(0.98); }

  @media (hover: hover) {
    .btn:hover { filter: brightness(1.04); }
  }

  .btn svg { width: 24px; height: 24px; flex-shrink: 0; }

  .btn-whatsapp { background: var(--rosa); color: var(--ink); }
  .btn-location { background: var(--tostado); color: var(--ink); }
  .btn-tiktok   { background: var(--ink); color: var(--cream); }

  .btn-menu { background: var(--carmesi); color: var(--cream); }

  .footer {
    margin-top: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .divider {
    width: 36px;
    height: 1px;
    background: var(--ink-faint);
  }

  .handle {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--ink-soft);
  }
</style>
