:root{
  --crema:#F1E8D7;
  --carmesi:#741324;
  --precio:#4A1817;
  --tostado:#9A7246;
  --icono:#A07848;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--precio)}
body{font-family:"Baloo 2",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.menu{
  container-type:inline-size;
  width:100%;max-width:540px;margin:0 auto;
  padding:4cqw 0 7cqw;
  position:relative;
}
.volver{
  position:absolute;top:3.5cqw;left:4cqw;
  display:inline-flex;align-items:center;gap:1.2cqw;
  min-height:44px;padding:0 2cqw;
  color:var(--carmesi);text-decoration:none;
  font-weight:700;font-size:max(14px,3.2cqw);
}
.volver svg{width:max(16px,3.6cqw);height:max(16px,3.6cqw)}
.logo{display:block;width:26cqw;height:auto;margin:0 auto}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:6cqw;row-gap:3.5cqw;
  padding:2.5cqw 11cqw 0;
}
.item{display:flex;flex-direction:column;align-items:center;margin:0}
.arco{display:block;width:100%;height:auto;overflow:visible}
.arco text{font-family:"Titan One",system-ui,sans-serif;font-size:38px;fill:var(--tostado);letter-spacing:.5px}
.foto{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;margin-top:-1cqw}
.precio{margin-top:2cqw;font-size:3.8cqw;font-weight:600;letter-spacing:.2px;color:var(--precio);white-space:nowrap}
.pie{display:flex;flex-direction:column;align-items:center;gap:1.4cqw;margin-top:6cqw}
.pie a{
  display:inline-flex;align-items:center;gap:1.6cqw;min-height:44px;
  font-family:"Titan One",system-ui,sans-serif;font-size:max(18px,4.6cqw);
  color:var(--carmesi);text-decoration:none
}
.pie svg{width:max(22px,5cqw);height:max(22px,5cqw);color:var(--icono);flex-shrink:0}
.redes{display:inline-flex;align-items:center;gap:1.4cqw}
.redes a{min-width:44px;justify-content:center}
.pie a:hover{color:#4A0B16}
.pie a:focus-visible,.volver:focus-visible{outline:2px solid var(--carmesi);outline-offset:3px;border-radius:8px}
@media (min-width:541px){.menu{padding-top:22px}}
@media print{.volver{display:none}}
.poster .volver{display:none}
.poster .menu{padding:4.5cqw 0 3cqw}
.poster .logo{width:23cqw}
.poster .grid{padding:1.5cqw 19.5cqw 0;column-gap:8cqw;row-gap:1.8cqw}
.poster .precio{font-size:3.1cqw;margin-top:1cqw}
.poster .pie{margin-top:4cqw;gap:0}
.subtitulo{margin:7cqw 0 0;font-family:"Titan One",system-ui,sans-serif;font-weight:400;font-size:5.4cqw;color:var(--carmesi);text-align:center}
.item.ancho{grid-column:1/-1}
.foto.ancha{width:78%;aspect-ratio:auto;margin-top:0}
.precio .desc{display:block;white-space:normal;text-align:center;font-weight:700;font-size:3.3cqw;line-height:1.2;color:var(--carmesi);margin-bottom:.6cqw}
.precio{text-align:center}
.poster .subtitulo{display:none}
</style>
